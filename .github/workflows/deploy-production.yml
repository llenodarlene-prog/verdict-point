name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: {group: production, cancel-in-progress: false}
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci && npm run release:check && BUILD_ENV=production npm run verify
        env: {SITE_URL: "${{ vars.SITE_URL }}"}
      - run: bash scripts/deploy-atomic.sh
        env:
          DEPLOY_HOST: "${{ secrets.DEPLOY_HOST }}"
          DEPLOY_USER: "${{ secrets.DEPLOY_USER }}"
          DEPLOY_ROOT: "${{ secrets.DEPLOY_ROOT }}"
          DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}"
          SSH_KNOWN_HOSTS: "${{ secrets.SSH_KNOWN_HOSTS }}"
      - run: node scripts/smoke-test.mjs
        env:
          SMOKE_URL: "${{ vars.SITE_URL }}"
          SMOKE_CANONICAL_URL: "${{ vars.SITE_URL }}"
          SMOKE_BRAND: "${{ vars.SITE_NAME }}"
          SMOKE_EXPECT_ROBOTS: index
