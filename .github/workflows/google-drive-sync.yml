name: Google Drive source sync
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: google-drive-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read approved Drive sources
        run: node scripts/sync-google-drive.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - run: node scripts/import-drive-drafts.mjs && npm run verify
      - name: Propose reviewed source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          branch=feature/google-drive-sync
          git switch -C "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/google-drive data/google-drive-sources.json data/drive-import-report.json content/posts content/research
          git commit -m 'chore: sync approved Verdict Point Drive sources'
          git push --force-with-lease origin "$branch"
          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --head "$branch" --base main --title 'Sync Verdict Point Drive source changes' --body 'Approved Drive sources were refreshed and draft import plus repository verification passed. Review the editorial diff before merging. Production release approvals remain required.'
          fi
