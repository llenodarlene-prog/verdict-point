name: Scheduled publish
# Check every hour. A deploy only runs when an approved post on main reached its publication
# date and publish_time (publish_timezone) since the previous check. The production environment approval still applies.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: main}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .nvmrc}
      - id: check
        run: node scripts/schedule.mjs due
  deploy:
    needs: due
    if: needs.due.outputs.due == 'true'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
